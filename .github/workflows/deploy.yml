name: Spring Boot with Gradle Deployment

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Import secrets
      run: |
        cd ./src/main/resources
        echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./application.properties
      shell: bash

    - name: Build with Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew build -x test

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Add remote server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

    - name: Transfer built jar file via SCP
      run: |
        # 최대 3번 시도
        for i in {1..3}; do
          echo "Attempt $i of 3..."
          if scp -B -o ConnectTimeout=30 \
              -P ${{ secrets.SERVER_PORT }} \
              ./build/libs/app.jar \
              ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SSH_USER }}/deploy/kau-medicare/web/app.jar; then
            echo "Transfer successful on attempt $i"
            exit 0
          else
            echo "Attempt $i failed"
            if [ $i -lt 3 ]; then
              echo "Waiting 10 seconds before next attempt..."
              sleep 10
            fi
          fi
        done
        echo "All transfer attempts failed" >&2
        exit 1

    - name: Set permissions on deploy directory
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          sudo chmod -R 775 /home/ubuntu/deploy
          sudo chown -R ubuntu:ubuntu /home/ubuntu/deploy

    - name: Transfer chatbot directory via SCP
      run: scp -P ${{ secrets.SERVER_PORT }} -r ./chatbot ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SSH_USER }}/deploy

    - name: Set execute permissions for chatbot.py
      run: ssh -p ${{ secrets.SERVER_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "chmod +x /home/${{ secrets.SSH_USER }}/deploy/chatbot/chatbot.py"

    - name: Execute remote commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          cd ~/deploy/kau-medicare/
          export DB_URL="${{ secrets.DB_URL }}"
          export DB_USER_NAME="${{ secrets.DB_USER_NAME }}"
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          sudo docker-compose down && sudo docker-compose build --no-cache && sudo docker-compose up -d
          



          


