version: '3'

services:
  db:
    image: mysql:8.0
    container_name: kau-medicare-db
    expose:
      - "3306"
    volumes:
      - ./db/data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  app:
    container_name: kau-medicare-app
    image: openjdk:17
    volumes:
      - ./web:/root
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER_NAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - AI_SERVICE_URL=http://ai-service:5000
    command: /bin/bash -c "/root/wait-for-it.sh db:3306 -s -t 100 -- java -jar /root/app.jar"
    restart: unless-stopped
    networks:
      - app-network

  ai-service:
    container_name: kau-medicare-ai
    image: python:3.9-slim
    volumes:
      - /home/ubuntu/deploy/chatbot:/app
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: >
      bash -c "pip install -r requirements.txt &&
              python chatbot.py"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/chat -H 'Content-Type: application/json' -d '{\"message\":\"test\"}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: